name: Build Zygisk-Il2CppDumper

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Show NDK
        run: |
          echo "NDK=$ANDROID_NDK_HOME"
          echo "NDK_HOME=$ANDROID_NDK_HOME"
          ls $ANDROID_NDK_HOME

      - name: Build (ndk-build, arm64-v8a)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -e
          # собираем arm64-v8a
          ndk-build NDK_PROJECT_PATH=. APP_ABI=arm64-v8a NDK_APPLICATION_MK=./jni/Application.mk -j$(nproc)
          echo "=== built artifacts ==="
          find . -name '*.so' -type f | head -20

      - name: Package module zip
        run: |
          set -e
          # структура модуля: module/ + zygisk/arm64-v8a.so
          # у Perfare обычно .so кладётся в module/zygisk/
          mkdir -p out/zygisk
          # ищем собранный .so
          SO=$(find libs -name '*.so' -path '*arm64-v8a*' | head -1)
          if [ -z "$SO" ]; then SO=$(find . -name '*.so' -path '*arm64-v8a*' | head -1); fi
          echo "SO=$SO"
          cp "$SO" out/zygisk/arm64-v8a.so

          # копируем файлы модуля из шаблона, если есть
          if [ -d module ]; then
            cp -r module/* out/ || true
          fi

          # гарантируем наличие module.prop (если шаблон не дал)
          if [ ! -f out/module.prop ]; then
            cat > out/module.prop <<'EOF'
          id=zygisk-il2cppdumper
          name=Zygisk-Il2CppDumper
          version=v1.0-custom
          versionCode=1
          author=Perfare
          description=Il2CppDumper via Zygisk
          EOF
          fi

          # обрезаем лишние пробелы в module.prop (heredoc с отступом)
          sed -i 's/^ *//' out/module.prop || true

          cd out
          zip -r ../Zygisk-Il2CppDumper-arm64.zip .
          cd ..
          ls -la Zygisk-Il2CppDumper-arm64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zygisk-Il2CppDumper-arm64
          path: Zygisk-Il2CppDumper-arm64.zip
          if-no-files-found: error
