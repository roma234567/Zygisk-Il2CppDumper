name: Build Zygisk Il2CppDumper

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Build with ndk-build
        run: |
          export ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}
          ndk-build NDK_PROJECT_PATH=. APP_ABI=arm64-v8a -j$(nproc)

      - name: Prepare Module Zip
        run: |
          mkdir -p package/zygisk
          cp libs/arm64-v8a/*.so package/zygisk/arm64-v8a.so
          
          cat << 'EOF' > package/module.prop
          id=zygisk-il2cppdumper
          name=Zygisk-Il2CppDumper
          version=v1.0-custom
          versionCode=1
          author=Perfare
          description=Il2CppDumper via Zygisk
          EOF
          
          sed -i 's/^ *//' package/module.prop
          
          cd package
          zip -r ../Zygisk-Il2CppDumper-custom.zip .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zygisk-Il2CppDumper-custom
          path: Zygisk-Il2CppDumper-custom.zip
